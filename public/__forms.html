<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Formularios (detección de Netlify Forms)</title>
  </head>
  <body>
    <!--
      Archivo estático para que Netlify detecte el formulario en el build.
      El formulario real vive en components/ContactForm.tsx y envía por fetch POST a /__forms.html.
      Los campos deben coincidir exactamente con los del componente.
    -->
    <form name="contacto" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contacto" />
      <input name="bot-field" />
      <input name="name" type="text" />
      <input name="email" type="email" />
      <textarea name="message"></textarea>
      <input name="locale" type="hidden" />
    </form>
  </body>
</html>
